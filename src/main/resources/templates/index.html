
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>

<h1>Todo List</h1>

<form action="/todos" method="post">
    <input
            type="text"
            name="title"
            placeholder="What needs to be done?"
            required
    >
    <button type="submit">Add</button>
</form>



<p th:if="${error}" th:text="${error}"></p>

<p th:if="${#lists.isEmpty(todos)}">No tasks yet.</p>

<ul>
    <li th:each="todo : ${todos}"
    th:style="${todo.completed} ? 'text-decoration: line-through' : 'text-decoration: none'">
        <form th:action = "@{/todos/{id}/edit(id=${todo.id})}" method = "post">
            <input
            type = "text"
            name = "title"
            th:value="${todo.title}"
            required>
            <button type="Submit">Save</button>


        </form>
        <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post">
            <button type="submit"
                    th:text="${todo.completed} ? 'Mark as incomplete' : 'Mark as complete'">
            </button>
        </form>
    </li>
</ul>

</body>
</html>
